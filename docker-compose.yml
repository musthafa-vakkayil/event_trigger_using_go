services:
  postgres:
    build:
      context: ./db
      dockerfile: Dockerfile
    shm_size: 128mb
    container_name: postgres_db
    environment:
      - POSTGRES_DB=eventdb
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d eventdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  golang_server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: golang_server
    ports:
      - "80:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

volumes:
  postgres_data:
